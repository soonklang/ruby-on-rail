services:
  - type: web
    name: workshop-todolist
    runtime: ruby
    plan: starter
    buildCommand: bundle install
    startCommand: bin/dev
    healthCheckPath: /up
    disk:
      name: rails-storage
      mountPath: /opt/render/project/src/storage
      sizeGB: 1
    envVars:
      - key: RAILS_MASTER_KEY
        sync: false
      - key: RAILS_ENV
        value: production
      - key: RAILS_ENV
        value: production
